# ------------------------------------------------------------
# Project basic information
# ------------------------------------------------------------
name: yourappname
description: A new Flutter project.

# Prevents accidental publishing to pub.dev
publish_to: "none"

# App versioning
# format: version_name + build_number
version: 1.3.0+1

# ------------------------------------------------------------
# Environment configuration
# ------------------------------------------------------------
environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.0.0"

# ------------------------------------------------------------
# Dependencies (App required packages)
# ------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # ---------------- UI & Fonts ----------------
  cupertino_icons: ^1.0.8        # iOS style icons
  google_fonts: ^6.2.1           # Google fonts (fallback / optional)

  # ---------------- Local Storage ----------------
  shared_preferences: ^2.5.3     # Store simple key-value data

  # ---------------- UI Effects ----------------
  shimmer: ^3.0.0                # Loading shimmer effect
  fluttertoast: ^8.2.12          # Toast messages
  flutter_spinkit: ^5.2.1        # Loading indicators

  # ---------------- Images & Media ----------------
  cached_network_image: ^3.4.1   # Cached network images
  video_player: ^2.9.5           # Video playback
  image_picker: ^1.1.2           # Pick image from camera/gallery

  # ---------------- Forms & Inputs ----------------
  intl_phone_field: ^3.2.0       # Phone number input
  pinput: ^5.0.1                 # OTP / PIN input
  email_validator: ^3.0.0        # Email validation

  # ---------------- Firebase ----------------
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  onesignal_flutter: ^5.3.2      # Push notifications

  # ---------------- Networking ----------------
  dio: ^5.8.0+1                  # API calls
  pretty_dio_logger: ^1.4.0      # Dio request/response logs
  http: ^1.4.0                   # HTTP requests

  # ---------------- State Management ----------------
  provider: ^6.1.5               # State management

  # ---------------- UI Widgets ----------------
  readmore: ^3.0.0
  flutter_slidable: ^4.0.0
  flutter_rating_bar: ^4.0.1
  custom_rating_bar: ^3.0.0
  dotted_border: ^2.1.0
  responsive_grid_list: ^1.4.0
  expandable_text: ^2.3.0
  marquee: ^2.3.0

  # ---------------- Localization ----------------
  intl: ^0.20.2
  flutter_locales: ^3.0.3

  # ---------------- Files & Storage ----------------
  path_provider: ^2.1.5
  file_picker: ^10.1.9
  path: ^1.9.0
  internet_file: ^1.2.0

  # ---------------- Ads ----------------
  google_mobile_ads: ^6.0.0

  # ---------------- Web & HTML ----------------
  flutter_html: ^3.0.0
  html: ^0.15.6
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5

  # ---------------- PDF & EPUB ----------------
  syncfusion_flutter_pdfviewer: ^29.1.38
  syncfusion_flutter_pdf: ^29.1.38
  epub_view: ^3.2.0

  # ---------------- Payments ----------------
  pay_with_paystack: ^1.2.0
  flutter_stripe: ^11.4.0
  razorpay_flutter: ^1.4.0
  flutterwave_standard_smart: ^1.0.4
  paytmpayments_allinonesdk: ^1.0.4

  # ---------------- In-App Purchase ----------------
  in_app_purchase: ^3.2.1
  in_app_purchase_storekit: ^0.4.0
  in_app_purchase_android: ^0.4.0+1

  # ---------------- Audio ----------------
  just_audio: ^0.10.2
  just_audio_background: ^0.0.1-beta.17
  audio_video_progress_bar: ^2.0.3
  miniplayer: ^1.0.1

  # ---------------- Utilities ----------------
  crypto: ^3.0.6
  uuid: ^4.5.1
  async: ^2.11.0
  rxdart: ^0.28.0
  iconify_flutter: ^0.0.7
  font_awesome_flutter: ^10.8.0
  carousel_slider: ^5.0.0
  carousel_indicator: ^1.0.6
  responsive_framework: ^1.5.1
  share_plus: ^11.0.0
  flutter_staggered_grid_view: ^0.7.0
  progress_dialog_null_safe: ^3.0.0
  confetti: ^0.8.0
  screen_protector: ^1.5.1

# ------------------------------------------------------------
# Dependency overrides (force versions if conflict)
# ------------------------------------------------------------
dependency_overrides:
  http: any
  webview_flutter: ^4.13.0

# ------------------------------------------------------------
# Dev dependencies (development only)
# ------------------------------------------------------------
dev_dependencies:
  rename: ^3.0.2                 # App rename utility
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0          # Lint rules

# ------------------------------------------------------------
# Flutter specific configuration
# ------------------------------------------------------------
flutter:
  uses-material-design: true

  # ---------------- ASSETS ----------------
  assets:
    - assets/appicon/
    - assets/images/
    - assets/locales/en.json
    - assets/locales/ar.json
    - assets/locales/hi.json

  # ---------------- SF PRO DISPLAY FONT ----------------
  # Apple official SF Pro Display font
  # Used for iOS-style UI & premium typography
  fonts:
    - family: SFProDisplay
      fonts:

        # Regular – default normal text
        - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF
          weight: 400

        # Medium – buttons, subtitles
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.OTF
          weight: 500

        # Bold – headings, titles
        - asset: assets/fonts/SFPRODISPLAYBOLD.OTF
          weight: 700

        # Black Italic – strong emphasis (rare use)
        - asset: assets/fonts/SFPRODISPLAYBLACKITALIC.OTF
          weight: 900
          style: italic

        # Heavy Italic – banners / highlights
        - asset: assets/fonts/SFPRODISPLAYHEAVYITALIC.OTF
          weight: 800
          style: italic

        # Semibold Italic – secondary emphasis
        - asset: assets/fonts/SFPRODISPLAYSEMIBOLDITALIC.OTF
          weight: 600
          style: italic

        # Light Italic – subtle text
        - asset: assets/fonts/SFPRODISPLAYLIGHTITALIC.OTF
          weight: 300
          style: italic

        # Thin Italic – very light captions
        - asset: assets/fonts/SFPRODISPLAYTHINITALIC.OTF
          weight: 200
          style: italic

        # UltraLight Italic – decorative / minimal UI
        - asset: assets/fonts/SFPRODISPLAYULTRALIGHTITALIC.OTF
          weight: 100
          style: italic
